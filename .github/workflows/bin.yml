# Single-file PC build for Linux (docs/architecture/07-standalone.md#bin): server + page + pack in one executable.
# Runs on a tag v* (file goes to the GitHub Release of the tag) or by hand (workflow artifact). No secrets needed.
# Pack: repository variable ZACH_PACK (e.g. packs/my-pack); empty = the only folder in packs/.
name: bin

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ZACH_PACK: ${{ vars.ZACH_PACK }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build:local
      - run: npm run build:bin

      - name: Smoke test
        run: |
          XDG_DATA_HOME="$RUNNER_TEMP/share" dist/bin/zachetka-linux-x64 --port 4399 --no-browser &
          for i in $(seq 1 25); do curl -fsS http://127.0.0.1:4399/api/health && break; sleep 0.2; done
          curl -fsS http://127.0.0.1:4399/ | grep -q "<title>"
          kill %1

      - name: Attach to the release of the tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/bin/zachetka-linux-x64

      - name: Keep as a workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: zachetka-linux-x64
          path: dist/bin/zachetka-linux-x64
          retention-days: 14
