# Leak check on every push (docs/architecture/13-classmates.md#scrub): generic patterns only
# (tools/release/patterns.txt); personal ones live outside the repo.
name: audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: tools/release/audit.sh
